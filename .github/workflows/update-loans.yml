name: 図書館 返却リスト 日次更新

on:
  schedule:
    # 毎夕 09:00 JST（= UTC 0:00）に実行
    - cron: '7 0 * * *'
    # 毎夕 10:00 JST（= UTC 1:00）に実行
    - cron: '7 01 * * *'
    # 毎夕 11:00 JST（= UTC 2:00）に実行
    - cron: '7 02 * * *'
    # 毎夕 12:00 JST（= UTC 3:00）に実
    - cron: '7 03 * * *'
    # 毎夕 13:00 JST（= UTC 4:00）に実行
    - cron: '7 04 * * *'
    # 毎夕 14:00 JST（= UTC 5:00）に実行
    - cron: '7 05 * * *'
    # 毎夕 15:00 JST（= UTC 6:00）に実行
    - cron: '7 06 * * *'
    # 毎夕 16:00 JST（= UTC 7 00）に実行
    - cron: '7 07 * * *'
    # 毎夕 17:00 JST（= UTC 8:00）に実行
    - cron: '7 08 * * *'   
    # 毎夕 18:00 JST（= UTC 9:00）に実行
    - cron: '7 09 * * *'
   # 毎夕 19:00 JST（= UTC 10:00）に実行
    - cron: '7 10 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh-pagesブランチへのpushに必要

    steps:
      # ── 1. リポジトリをチェックアウト ──────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python セットアップ ─────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. 依存ライブラリをインストール ────────────────────
      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4
          playwright install chromium --with-deps

      # ── 4. config.json をシークレットから復元 ──────────────
      #   GitHub リポジトリ Settings → Secrets and variables → Actions で
      #   「LIBRARY_CONFIG」という名前でconfig.jsonの中身をまるごと登録してください。
      - name: Restore config.json
        run: echo '${{ secrets.LIBRARY_CONFIG }}' > config.json

      # ── 5. スクレイピング実行 → loans.json 生成 ────────────
      - name: Run scraper
        run: python export_loans.py

      # ── 6. gh-pages ブランチにデプロイ ────────────────────
      #   index.html と loans.json を gh-pages ブランチに配置する。
      #   peaceiris/actions-gh-pages は publish_dir 以下を丸ごとデプロイする。
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./    # リポジトリルートをそのまま公開
          publish_branch: gh-pages
          # デプロイ対象ファイルを明示（不要なファイルを除外）
          exclude_assets: '.github,scraper.py,app.py,export_loans.py,config.json,README.md'
          # デプロイコミットメッセージ
          commit_message: "🤖 loans.json 更新 (${{ github.run_id }})"
          # 毎回クリーンデプロイしない（loans.jsonのみ上書き）
          keep_files: true
